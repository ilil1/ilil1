ll="#9b631f" font-weight="700" text-anchor="start">PVC → 2c EBS · 대기 DB 데이터</text><path d="M440 325 V385" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340 325 V345 H615 V385" fill="none" stroke="#7993a6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="1015" y="374" font-size="19" fill="#72899a" font-weight="600" text-anchor="start">평소 주 DB 접속</text><path d="M790 450 H980" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="405" width="170" height="36" rx="12" fill="#fff" stroke="#d1dce3" stroke-width="2"/><text x="885" y="430" font-size="21" fill="#4e6b7e" font-weight="700" text-anchor="middle">데이터 복제</text><path d="M440 510 V539" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M1340 510 V539" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="720" width="1740" height="620" rx="20" fill="#fff" stroke="#bbcbd5" stroke-width="2"/><text x="55" y="762" font-size="27" fill="#a05b28" font-weight="700" text-anchor="start">② 2a 장애 발생 후</text><text x="302" y="762" font-size="22" fill="#566f80" font-weight="400" text-anchor="start">설정된 장애 조치와 요청 전환이 동작한 뒤의 예시입니다.</text><rect x="55" y="782" width="790" height="530" rx="20" fill="#f6f7f8" stroke="#cdd5dc" stroke-width="2" stroke-dasharray="9 8"/><text x="79" y="818" font-size="25" fill="#99a2ab" font-weight="700" text-anchor="start">가용 영역 2a · 장애</text><rect x="955" y="782" width="790" height="530" rx="20" fill="#f7fafc" stroke="#a9bdca" stroke-width="2" stroke-dasharray="9 8"/><text x="979" y="818" font-size="25" fill="#4b6475" font-weight="700" text-anchor="start">가용 영역 2c</text><rect x="90" y="858" width="700" height="94" rx="14" fill="#f5f6f8" stroke="#cfd5da" stroke-width="2"/><rect x="110" y="879" width="49" height="49" rx="9" fill="#e5e8eb" stroke="#e5e8eb" stroke-width="2"/><rect x="120" y="890" width="29" height="26" rx="3" fill="none" stroke="white" stroke-width="2"/><path d="M120 898h29 M132 898v18" fill="none" stroke="white" stroke-width="2"/><text x="179" y="896" font-size="27" fill="#8b959e" font-weight="700" text-anchor="start">Core 서비스 Pod</text><text x="179" y="928" font-size="21" fill="#9da7b0" font-weight="400" text-anchor="start">가용 영역 장애로 사용 불가</text><rect x="990" y="858" width="700" height="94" rx="14" fill="#fff" stroke="#a8bfce" stroke-width="2"/><rect x="1010" y="879" width="49" height="49" rx="9" fill="#397ca5" stroke="#397ca5" stroke-width="2"/><rect x="1020" y="890" width="29" height="26" rx="3" fill="none" stroke="white" stroke-width="2"/><path d="M1020 898h29 M1032 898v18" fill="none" stroke="white" stroke-width="2"/><text x="1079" y="896" font-size="27" fill="#243649" font-weight="700" text-anchor="start">Core 서비스 Pod</text><text x="1079" y="928" font-size="21" fill="#526e80" font-weight="400" text-anchor="start">2c Core가 사용자 요청 처리</text><rect x="1180" y="813" width="370" height="33" rx="10" fill="#eef8f2" stroke="#b2d8c7" stroke-width="2"/><text x="1365" y="837" font-size="19" fill="#33795e" font-weight="700" text-anchor="middle">사용자 요청을 2c로 전환 · 설정 필요</text><rect x="90" y="1015" width="700" height="113" rx="15" fill="#f3f4f5" stroke="#d2d8dc" stroke-width="2"/><ellipse cx="133" cy="1050" rx="19" ry="7" fill="none" stroke="#aab1b7" stroke-width="3"/><path d="M114 1050v24c0 9 38 9 38 0v-24 M114 1062c0 9 38 9 38 0" fill="none" stroke="#aab1b7" stroke-width="3"/><text x="178" y="1058" font-size="27" fill="#8b959e" font-weight="700" text-anchor="start">주 MySQL Pod · 장애</text><text x="178" y="1094" font-size="21" fill="#9da7b0" font-weight="400" text-anchor="start">2a 장애로 사용 불가</text><rect x="990" y="1015" width="700" height="113" rx="15" fill="#e9f5f0" stroke="#89bca9" stroke-width="2"/><ellipse cx="1033" cy="1050" rx="19" ry="7" fill="none" stroke="#318365" stroke-width="3"/><path d="M1014 1050v24c0 9 38 9 38 0v-24 M1014 1062c0 9 38 9 38 0" fill="none" stroke="#318365" stroke-width="3"/><text x="1078" y="1058" font-size="27" fill="#253f4f" font-weight="700" text-anchor="start">주 DB로 승격된 MySQL Pod</text><text x="1078" y="1094" font-size="21" fill="#526e80" font-weight="400" text-anchor="start">복제된 데이터로 읽기·쓰기</text><rect x="90" y="1180" width="700" height="69" rx="13" fill="#f4f5f6" stroke="#d2d8dc" stroke-width="2"/><text x="115" y="1210" font-size="23" fill="#9ca5ad" font-weight="700" text-anchor="start">PVC → 기존 2a EBS</text><text x="115" y="1235" font-size="19" fill="#aab3ba" font-weight="400" text-anchor="start">장애 영역의 볼륨</text><rect x="990" y="1180" width="700" height="69" rx="13" fill="#fff9f2" stroke="#e4c29d" stroke-width="2"/><text x="1015" y="1210" font-size="23" fill="#9b631f" font-weight="700" text-anchor="start">PVC → 2c EBS · 복제된 데이터</text><path d="M1340 954 V1004" fill="none" stroke="#258563" stroke-width="3" marker-end="url(#green)" stroke-linecap="round" stroke-linejoin="round"/><text x="1365" y="986" font-size="21" fill="#258563" font-weight="700" text-anchor="start">읽기 · 쓰기</text><path d="M1340 1130 V1170" fill="none" stroke="#258563" stroke-width="3" marker-end="url(#green)" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 1046 l34 34 m0 -34 l-34 34" stroke="#b77d77" stroke-width="6" stroke-linecap="round"/><rect x="800" y="1060" width="180" height="74" rx="13" fill="#fff" stroke="#d2dce1" stroke-width="2"/><text x="890" y="1088" font-size="21" fill="#637a89" font-weight="700" text-anchor="middle">장애 조치</text><text x="890" y="1115" font-size="18" fill="#7b8b95" font-weight="400" text-anchor="middle">전환 설정 필요</text><text x="80" y="1290" font-size="20" fill="#617887" font-weight="400" text-anchor="start">2c에서 DB를 주 역할로 전환하고 Core의 DB 재연결을 구성해야 합니다.</text><rect x="30" y="1360" width="1740" height="410" rx="20" fill="#f4f7fa" stroke="#d1dce3" stroke-width="2"/><text x="60" y="1397" font-size="26" fill="#344c5f" font-weight="700" text-anchor="start">별도 백업과 과거 시점 복구</text><rect x="60" y="1430" width="430" height="100" rx="14" fill="#fff" stroke="#c3d3df" stroke-width="2"/><text x="82" y="1467" font-size="23" fill="#344c5f" font-weight="700" text-anchor="start">① 일관성 있는 전체 백업</text><text x="82" y="1501" font-size="20" fill="#688090" font-weight="400" text-anchor="start">DB 백업 또는 EBS 스냅샷</text><rect x="60" y="1550" width="430" height="100" rx="14" fill="#fff" stroke="#c3d3df" stroke-width="2"/><text x="82" y="1587" font-size="23" fill="#344c5f" font-weight="700" text-anchor="start">② MySQL 변경 기록</text><text x="82" y="1621" font-size="20" fill="#688090" font-weight="400" text-anchor="start">binlog를 장애 영역 밖으로 전달</text><rect x="600" y="1430" width="465" height="220" rx="14" fill="#fff" stroke="#c3d3df" stroke-width="2"/><text x="624" y="1467" font-size="23" fill="#344c5f" font-weight="700" text-anchor="start">독립적인 백업 보관</text><text x="624" y="1507" font-size="20" fill="#688090" font-weight="400" text-anchor="start">백업 파일 · binlog: S3 등</text><text x="624" y="1542" font-size="20" fill="#688090" font-weight="400" text-anchor="start">EBS 스냅샷: AWS에서 별도 관리</text><text x="624" y="1584" font-size="20" fill="#688090" font-weight="400" text-anchor="start">백업 기준점과 로그 이력 관리</text><rect x="1175" y="1430" width="525" height="220" rx="14" fill="#fff" stroke="#c3d3df" stroke-width="2"/><text x="1199" y="1467" font-size="23" fill="#344c5f" font-weight="700" text-anchor="start">③ 원하는 시점으로 복구</text><text x="1199" y="1507" font-size="20" fill="#688090" font-weight="400" text-anchor="start">백업을 복원하고 binlog 적용</text><text x="1199" y="1542" font-size="20" fill="#688090" font-weight="400" text-anchor="start">스냅샷은 2c에 새 EBS로 복원</text><text x="1199" y="1577" font-size="20" fill="#688090" font-weight="400" text-anchor="start">새 EBS와 MySQL Pod 연결</text><text x="1199" y="1612" font-size="20" fill="#688090" font-weight="400" text-anchor="start">DB 백업은 MySQL에 데이터 복원</text><path d="M490 1480 H590" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 1600 H590" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M1065 1540 H1165" fill="none" stroke="#7993a6" stroke-width="3" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="1694" font-size="22" fill="#486275" font-weight="700" text-anchor="start">복제는 장애 전환에 사용하고, 백업은 삭제·손상 이전 데이터 복구에 사용합니다.</text><text x="60" y="1728" font-size="20" fill="#708493" font-weight="400" text-anchor="start">변경 기록은 별도 보관된 범위까지만 복구할 수 있으며 복구 시간도 필요합니다.</text><text x="60" y="1760" font-size="20" fill="#708493" font-weight="400" text-anchor="start">다중 AZ 복제·전환과 정기 시점 복구 체계는 향후 개선안입니다.</text><path d="M434 375 L446 375 L440 386 Z" fill="#7993a6"/><path d="M609 375 L621 375 L615 386 Z" fill="#7993a6"/><path d="M434 529 L446 529 L440 540 Z" fill="#7993a6"/><path d="M1334 529 L1346 529 L1340 540 Z" fill="#7993a6"/><path d="M970 444 L970 456 L981 450 Z" fill="#7993a6"/><path d="M580 1474 L580 1486 L591 1480 Z" fill="#7993a6"/><path d="M580 1594 L580 1606 L591 1600 Z" fill="#7993a6"/><path d="M1155 1534 L1155 1546 L1166 1540 Z" fill="#7993a6"/><path d="M1333 993 L1347 993 L1340 1005 Z" fill="#258563"/><path d="M1333 1159 L1347 1159 L1340 1171 Z" fill="#258563"/></g></svg>