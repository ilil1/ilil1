<g transform="translate(0,-645)"><text x="68" y="696" font-size="29" font-weight="650" fill="#a26724">클러스터를 지원하는 AWS 저장소</text>
<rect x="68" y="725" width="666" height="386" rx="18" fill="#fff" stroke="#d4e0e9" stroke-width="2" />
<image x="90" y="746" width="38" height="38" href="data:image/svg+xml;base64," />
<text x="143" y="778" font-size="27" font-weight="650" fill="#a26724">EBS gp3 · 서비스 데이터 보존</text>
<text x="91" y="833" font-size="25" font-weight="600" fill="#2469b5">Pod → PVC → PV → EBS gp3</text>
<text x="91" y="878" font-size="22" font-weight="400" fill="#5b7185">EBS CSI: 볼륨 생성 · 연결</text>
<text x="91" y="916" font-size="22" font-weight="400" fill="#5b7185">암호화 · Retain · 가용 영역 종속</text>
<text x="91" y="954" font-size="22" font-weight="400" fill="#5b7185">2026-10-12 복원 기록: PVC 13개</text>
<text x="91" y="992" font-size="22" font-weight="400" fill="#5b7185">업무 7 · 평가 2 · 관측 4</text>
<text x="91" y="1030" font-size="22" font-weight="400" fill="#5b7185">MySQL 등은 StatefulSet으로 관리</text>
<text x="91" y="1068" font-size="22" font-weight="400" fill="#5b7185">EC2 노드 루트 볼륨과 별도</text>
<rect x="766" y="725" width="666" height="386" rx="18" fill="#fff" stroke="#d4e0e9" stroke-width="2" />
<image x="788" y="746" width="38" height="38" href="data:image/svg+xml;base64," />
<text x="841" y="778" font-size="27" font-weight="650" fill="#a26724">ECR · 컨테이너 이미지 저장</text>
<text x="789" y="833" font-size="25" font-weight="600" fill="#2469b5">CodeBuild → ECR → EKS 노드</text>
<text x="789" y="878" font-size="22" font-weight="400" fill="#5b7185">이후 GitOps: 자체 이미지 5종 대상</text>
<text x="789" y="916" font-size="22" font-weight="400" fill="#5b7185">기존 이미지는 재사용</text>
<text x="789" y="954" font-size="22" font-weight="400" fill="#5b7185">노드가 digest로 실행 이미지 가져오기</text>
<text x="789" y="992" font-size="22" font-weight="400" fill="#5b7185">불변 Git SHA 태그로 소스 버전 연결</text>
<text x="789" y="1030" font-size="22" font-weight="400" fill="#5b7185">다른 공식 이미지도 클러스터에서 사용</text>
<rect x="1464" y="725" width="666" height="386" rx="18" fill="#fff" stroke="#d4e0e9" stroke-width="2" />
<text x="1488" y="778" font-size="27" font-weight="650" fill="#a26724">S3 · 이전 백업 보관</text>
<text x="1488" y="833" font-size="25" font-weight="600" fill="#2469b5">이전 백업 → S3 → EBS 복원</text>
<text x="1488" y="878" font-size="22" font-weight="400" fill="#5b7185">암호화 백업 · 메타데이터 보관</text>
<text x="1488" y="916" font-size="22" font-weight="400" fill="#5b7185">비공개 · 버전 관리 · SHA-256 확인</text>
<text x="1488" y="954" font-size="22" font-weight="400" fill="#5b7185">이전 시점 백업을 데이터 복원에 사용</text>
<text x="1488" y="992" font-size="22" font-weight="400" fill="#5b7185">상시 백업 · 자동 동기화와 구분</text>
