<text x="1365" y="391" font-size="27" fill="#5b7084" font-weight="400">Core / AI 세 번째 Pod 배치</text>
<text x="1365" y="434" font-size="27" fill="#5b7084" font-weight="400">Core·AI는 서비스별 노드당 최대 1개</text>
<text x="1365" y="477" font-size="27" fill="#5b7084" font-weight="400">Gateway는 HPA로 1~3개</text>
<text x="1365" y="520" font-size="27" fill="#5b7084" font-weight="400">자원 · 배치 조건에 맞춰 스케줄</text>
<text x="1365" y="563" font-size="27" fill="#5b7084" font-weight="400">application 풀: 최소 1 · 최대 2대</text>
<text x="60" y="741" font-size="30" fill="#19816d" font-weight="650">확장 흐름 · HPA는 Pod 수, Cluster Autoscaler는 노드 수를 조절</text>
