<text x="60" y="1014" font-size="26" fill="#5b7084" font-weight="400">축소: HPA 5분 안정화 후 Pod 1개씩 · 노드는 10분 불필요 + 안전한 이동 조건</text>
<text x="60" y="1052" font-size="26" fill="#5b7084" font-weight="400">PDB는 Core·AI 각각 최소 1개를 보호해 자발적 중단을 제한하며 노드 장애를 막지는 않습니다.</text>
<rect x="60" y="1085" width="1880" height="160" rx="13" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2.2"/>
<text x="82" y="1125" font-size="26" fill="#536e84" font-weight="400">Namespace는 논리 구분 · EC2는 실행 위치 · 제어 영역 서브넷은 2개 AZ</text>
<text x="82" y="1162" font-size="26" fill="#536e84" font-weight="400">EKS 관리 API: private 접근 + 관리자 IP로 제한된 public 접근</text>
<text x="82" y="1199" font-size="26" fill="#536e84" font-weight="400">워커와 데이터는 같은 AZ에 배치되며, Pod 분산은 다중 AZ 또는 DB 이중화를 보장하지 않습니다.</text>
<text x="82" y="1236" font-size="26" fill="#536e84" font-weight="400">서비스별 배치와 자동 확장은 설계·변경 목표이며 실제 적용·관찰 여부와 구분합니다.</text>
