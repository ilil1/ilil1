<text x="1002" y="863" font-size="26" fill="#5b7084" font-weight="400">application 노드 1대 추가</text>
<text x="1002" y="901" font-size="26" fill="#5b7084" font-weight="400">준비 후 대기 Pod 실행</text>
<rect x="1495" y="775" width="445" height="195" rx="17" fill="#fff" stroke="#d4e0ea" stroke-width="2.2"/>
