<text x="82" y="863" font-size="26" fill="#5b7084" font-weight="400">CPU requests 대비 평균 60%</text>
<text x="82" y="901" font-size="26" fill="#5b7084" font-weight="400">Core·AI: 각각 2~3개</text>
<text x="82" y="939" font-size="26" fill="#5b7084" font-weight="400">Gateway: 1~3개</text>
