<text x="60" y="78" font-size="31" fill="#a4651e" font-weight="650">AWS Sydney · 워커 노드 ap-southeast-2a</text>
<text x="60" y="116" font-size="27" fill="#60788b" font-weight="400">최초 배포: private EC2 2대 · 루트 볼륨 암호화 gp3 · 아래 배치는 변경 목표</text>
