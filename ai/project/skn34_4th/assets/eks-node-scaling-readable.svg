<text x="592" y="819" font-size="29" fill="#217f6d" font-weight="650">배치 대기 Pod</text>
<text x="592" y="863" font-size="26" fill="#5b7084" font-weight="400">기존 노드 자원 부족 또는</text>
<text x="592" y="901" font-size="26" fill="#5b7084" font-weight="400">Pod 분산 조건 미충족</text>
<rect x="980" y="775" width="470" height="195" rx="17" fill="#fff" stroke="#d4e0ea" stroke-width="2.2"/>
