<text x="85" y="520" font-size="27" fill="#5b7084" font-weight="400">RabbitMQ</text>
<text x="85" y="563" font-size="27" fill="#5b7084" font-weight="400">Core·AI는 서비스별 노드당 최대 1개</text>
