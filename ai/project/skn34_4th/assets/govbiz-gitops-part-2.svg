<text x="180" y="1028" font-size="26" font-weight="700" fill="#172b3a">05  Argo CD · 배포 설정 반영</text>
<text x="125" y="1067" font-size="22" font-weight="400" fill="#526675">Git 태그를 주기적으로 조회해 최고 버전 선택</text>
